<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>جدول الري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', Arial, sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 15px;
        }
        h1 {
            text-align: center;
            color: #0277bd;
            font-size: 32px;
        }
        h2 {
            color: #01579b;
        }
        .buttons {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            font-family: 'Cairo', Arial, sans-serif;
            font-size: 17px;
            font-weight: 700;
            padding: 12px 22px;
            margin: 5px;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .start { background-color: #0288d1; }
        .stop  { background-color: #546e7a; }
        .warn  { background-color: #f9a825; }
        .error { background-color: #e53935; }
        #status {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #01579b;
            background-color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        th {
            background-color: #0288d1;
            color: white;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #b3e5fc;
        }
        tr:nth-child(even) td {
            background-color: #f1fbfe;
        }
    </style>
</head>
<body>
    <h1>💧 تطبيق الري الذكي</h1>

    <div id="status">الحالة: الري متوقف</div>

    <div class="buttons">
        <button class="start" onclick="startIrrigation()">بدء الري</button>
        <button class="stop" onclick="stopIrrigation()">إيقاف الري</button>
        <button class="warn" onclick="showWarning()">تنبيه</button>
        <button class="error" onclick="showError()">عطل</button>
    </div>

    <h2>جدول المحاصيل</h2>
    <table>
        <tr>
            <th>المحصول</th>
            <th>النوع</th>
            <th>الري كل (يوم)</th>
            <th>المياه (لتر/م²)</th>
        </tr>
        <tr><td>طماطم</td><td>خضار</td><td>3</td><td>6</td></tr>
        <tr><td>خيار</td><td>خضار</td><td>2</td><td>5</td></tr>
        <tr><td>فلفل</td><td>خضار</td><td>3</td><td>5</td></tr>
        <tr><td>برتقال</td><td>فاكهة</td><td>7</td><td>20</td></tr>
        <tr><td>عنب</td><td>فاكهة</td><td>10</td><td>15</td></tr>
        <tr><td>فراولة</td><td>فاكهة</td><td>2</td><td>4</td></tr>
    </table>

    <script>
        let timer = null;

        function setStatus(text, bgColor, textColor) {
            let box = document.getElementById('status');
            box.innerText = text;
            box.style.backgroundColor = bgColor;
            box.style.color = textColor;
        }

        function startIrrigation() {
            if (timer !== null) {
                return;
            }
            let seconds = 10;
            setStatus('💧 الري شغال... باقي ' + seconds + ' ثانية', 'white', '#01579b');

            timer = setInterval(function () {
                seconds = seconds - 1;
                if (seconds > 0) {
                    setStatus('💧 الري شغال... باقي ' + seconds + ' ثانية', 'white', '#01579b');
                } else {
                    clearInterval(timer);
                    timer = null;
                    setStatus('✅ تم الانتهاء من الري', '#c8e6c9', '#1b5e20');
                }
            }, 1000);
        }

        function stopIrrigation() {
            clearInterval(timer);
            timer = null;
            setStatus('⏹️ تم إيقاف الري', 'white', '#01579b');
        }

        function showWarning() {
            setStatus('⚠️ تنبيه: التربة جافة، يلزم الري', '#fff8e1', '#e65100');
        }

        function showError() {
            clearInterval(timer);
            timer = null;
            setStatus('🚨 عطل في النظام! تم إيقاف الري', '#ffcdd2', '#b71c1c');
        }
    </script>
</body>
</html>
